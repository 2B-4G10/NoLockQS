version: 2
updates:
  # Once an update builds, CI puts it on main under the repository owner's name and closes the
  # pull request (see .github/workflows/android.yml).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: [ "*" ]
    ignore:
      # libxposed is left to the weekly update check (.github/scripts/check-updates.sh): its api and
      # service artifacts share one version, which moves targetApiVersion in module.prop with it.
      - dependency-name: "io.github.libxposed:*"
