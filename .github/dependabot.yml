version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      gradle:
        patterns: [ "*" ]
    ignore:
      # A new libxposed API level also means a new targetApiVersion in module.prop: bump it by hand.
      - dependency-name: "io.github.libxposed:api"
        update-types: [ "version-update:semver-major" ]
