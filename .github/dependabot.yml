version: 2
updates:
  # Each update is merged into main by CI as soon as it builds (see .github/workflows/android.yml).
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      gradle:
        patterns: [ "*" ]
    ignore:
      # A new libxposed API level also changes targetApiVersion in module.prop, so the weekly
      # update check (.github/scripts/check-updates.sh) moves both together.
      - dependency-name: "io.github.libxposed:api"
        update-types: [ "version-update:semver-major" ]
