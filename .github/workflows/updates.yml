name: Update check

# Weekly check for the updates that follow new Android and toolchain releases: the Gradle
# wrapper, the Android Gradle Plugin, the Android SDK level and libxposed (Dependabot covers the
# other Gradle dependencies). Each update is kept only if the build passes; those are pushed to
# main, and anything that needs a person is reported as an issue.
# Like the build, it only uses tools preinstalled on GitHub's Ubuntu runners.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-check
  cancel-in-progress: false

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Updates are authored by the repository owner and committed by github-actions[bot].
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Checkout main
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config --local http.extraheader "AUTHORIZATION: basic $auth"
          git fetch -q --depth=50 origin main
          git checkout -q -B main FETCH_HEAD
          owner_name=$(gh api "users/$GITHUB_REPOSITORY_OWNER" --jq '.name // empty' || true)
          git config --local user.name "${owner_name:-$GITHUB_REPOSITORY_OWNER}"
          git config --local user.email "$GITHUB_REPOSITORY_OWNER_ID+$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"
          echo "Updates are authored by $(git config user.name) <$(git config user.email)>"

      - name: Set up JDK and Android SDK
        run: .github/scripts/setup-toolchain.sh

      - name: Check Gradle, the Android Gradle Plugin, the Android SDK and libxposed
        run: .github/scripts/check-updates.sh
