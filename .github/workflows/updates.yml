name: Update check

# Weekly check for updates: the Gradle wrapper, the Android Gradle Plugin, Kotlin, the Android SDK
# level, the app's libraries and libxposed. Each update is kept only if the build passes; those are
# pushed to main and Android CI is started on them, and anything that needs a person is reported
# as an issue. Like the build, it only uses tools preinstalled on GitHub's Ubuntu runners, on a
# fixed Ubuntu release so that a new runner image can't change the build unannounced.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  # To start Android CI on what it pushes.
  actions: write

concurrency:
  group: update-check
  cancel-in-progress: false

jobs:
  check:
    name: Check for updates
    runs-on: ubuntu-24.04
    # Each update is built once; a full run with several updates stays well under this.
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      # Updates are authored by the repository owner and committed by github-actions[bot].
      GIT_COMMITTER_NAME: github-actions[bot]
      GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com

    steps:
      - name: Checkout main
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git config --local http.extraheader "AUTHORIZATION: basic $auth"
          git fetch -q --depth=50 origin main
          git checkout -q -B main FETCH_HEAD
          owner_name=$(gh api "users/$GITHUB_REPOSITORY_OWNER" --jq '.name // empty' || true)
          git config --local user.name "${owner_name:-$GITHUB_REPOSITORY_OWNER}"
          git config --local user.email "$GITHUB_REPOSITORY_OWNER_ID+$GITHUB_REPOSITORY_OWNER@users.noreply.github.com"
          echo "Updates are authored by $(git config user.name) <$(git config user.email)>"

      - name: Set up JDK and Android SDK
        run: .github/scripts/setup-toolchain.sh

      - name: Check Gradle, the Android Gradle Plugin, the Android SDK and libxposed
        run: .github/scripts/check-updates.sh

      # GitHub switches off a public repository's scheduled workflows after 60 days without
      # activity. Enabling a workflow that is already on starts those 60 days again, so the weekly
      # checks here and in xposed-modules-repo.yml never lapse during a quiet stretch. A workflow
      # switched off by hand is left off.
      - name: Keep the weekly workflows switched on
        if: ${{ !cancelled() }}
        run: |
          for workflow in updates.yml xposed-modules-repo.yml; do
            state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow" --jq .state || echo unknown)
            if [ "$state" = disabled_manually ]; then
              echo "::notice::$workflow was switched off by hand; leaving it off."
            elif gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/enable" --silent; then
              echo "$workflow: kept on (was $state)"
            else
              echo "::warning::Could not keep $workflow switched on; enable it in the Actions tab if it stops running."
            fi
          done
