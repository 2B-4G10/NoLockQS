name: Android CI

# This repository only allows actions owned by 2B-4G10, so every step is a plain shell step
# using the tools preinstalled on GitHub's Ubuntu runners: git, the JDKs, the Android SDK and gh.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  # Superseded PR builds are cancelled; main builds always finish because they may publish a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MODULE_PROP: app/src/main/resources/META-INF/xposed/module.prop
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      # module.prop holds the app version; the Gradle daemon JDK is pinned in
      # gradle/gradle-daemon-jvm.properties. A new version on main is published as v<version>.
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' "$MODULE_PROP" | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          echo "APK=NoLockQS-v$version.apk" >> "$GITHUB_ENV"
          release=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Only a published release has a tag; a leftover draft is replaced when publishing.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
              echo "::notice::v$version is already released. Bump version and versionCode in module.prop to publish a new release."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Set up JDK and Android SDK
        run: .github/scripts/setup-toolchain.sh

      - name: Load the signing key
        id: signing
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.NOLOCKQS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "NOLOCKQS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No NOLOCKQS_KEYSTORE_* secrets: $TAG is signed with a temporary key, so the previous version must be uninstalled first. Add the secrets to allow in-place updates."
          fi

      - name: Build debug and release APKs
        env:
          NOLOCKQS_KEYSTORE_PASSWORD: ${{ secrets.NOLOCKQS_KEYSTORE_PASSWORD }}
          NOLOCKQS_KEY_ALIAS: ${{ secrets.NOLOCKQS_KEY_ALIAS }}
          NOLOCKQS_KEY_PASSWORD: ${{ secrets.NOLOCKQS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # The release is named exactly like its tag, and the APK carries the same name.
      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          changes=$(.github/scripts/changelog.sh "$VERSION")
          {
            echo "## Install"
            echo "1. Install \`$APK\` on your rooted device."
            echo "2. In Vector, enable NoLockQS for **System UI** and **System Framework**."
            echo "3. Reboot and the protection is active."
            if [ -n "$changes" ]; then printf '\n## Changes\n%s\n' "$changes"; fi
            if [ "$SIGNED" != "true" ]; then
              printf '\n> [!WARNING]\n> Signed with a temporary key: uninstall the previous version before installing this one.\n'
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          # Replace any draft an earlier run left for this version.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\" and .author.login == \"github-actions[bot]\") | .id" \
            | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
          gh release create "$TAG" "$APK" --title "$TAG" --target "$GITHUB_SHA" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes

      # Dependabot can only open pull requests, and merging one would make dependabot[bot] the
      # author on main. Once its update builds, the same change goes straight to main under the
      # repository owner's name, with github-actions[bot] as the committer, and the pull request
      # is closed.
      - name: Put the Dependabot update on main
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/scripts/apply-dependabot-update.sh

  # Vector and LSPosed list modules from the Xposed Modules Repository (modules.lsposed.org), which
  # shows NoLockQS from github.com/Xposed-Modules-Repo/io.github.i2B4G10.NoLockQS. Every build on
  # main brings that repository up to date, and the version released here (now or before) is
  # released there with the same APK, tagged "<versionCode>-<versionName>" as its rules require.
  # Releases published here by hand go there through .github/workflows/xposed-modules-repo.yml,
  # which also checks on it every week.
  # It needs the XPOSED_MODULES_REPO_TOKEN secret: a personal access token (classic) of an admin
  # of that repository with only the public_repo scope. Without it this job only warns; add it,
  # then run this workflow on main to catch up. It runs apart from the build, which runs code from
  # third-party Gradle plugins and libraries that must not get near the token.
  xposed:
    name: Publish to the Xposed Modules Repository
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      - name: Set up JDK and Android SDK
        run: .github/scripts/setup-toolchain.sh

      - name: Publish to the Xposed Modules Repository
        env:
          MODULE_REPO: Xposed-Modules-Repo/io.github.i2B4G10.NoLockQS
          XPOSED_TOKEN: ${{ secrets.XPOSED_MODULES_REPO_TOKEN }}
          SOURCE_BRANCH: ${{ github.ref_name }}
          RELEASE_TAG: v${{ needs.build.outputs.version }}
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: .github/scripts/publish-xposed-modules-repo.sh
