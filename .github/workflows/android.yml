name: Android CI

# This repository only allows actions owned by 2B-4G10, so every step is a plain shell step
# using the tools preinstalled on GitHub's Ubuntu runners: git, the JDKs, the Android SDK and gh.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  # Superseded PR builds are cancelled; main builds always finish because they may publish a release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MODULE_PROP: app/src/main/resources/META-INF/xposed/module.prop
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        run: |
          git init -q .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -c http.extraheader="AUTHORIZATION: basic $auth" fetch -q --depth=1 origin "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD

      # module.prop holds the app version; the Gradle daemon JDK is pinned in
      # gradle/gradle-daemon-jvm.properties. A new version on main is published as v<version>.
      - name: Read version
        id: version
        run: |
          version=$(sed -n 's/^version=//p' "$MODULE_PROP" | tr -d '[:space:]')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "TAG=v$version" >> "$GITHUB_ENV"
          release=false
          if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            # Drafts have no tag yet, so releases are checked as well as tags.
            releases=$(gh release list --limit 1000 --json tagName --jq '.[].tagName')
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null \
               || grep -Fxq "v$version" <<< "$releases"; then
              echo "::notice::v$version already exists. Bump version and versionCode in module.prop to publish a new release."
            else
              release=true
            fi
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

      - name: Set up JDK and Android SDK
        run: |
          java=$(sed -n 's/^toolchainVersion=//p' gradle/gradle-daemon-jvm.properties | tr -d '[:space:]')
          jdk_var="JAVA_HOME_${java}_X64"
          if [ -n "${!jdk_var:-}" ]; then
            echo "JAVA_HOME=${!jdk_var}" >> "$GITHUB_ENV"
          else
            echo "::notice::JDK $java is not preinstalled on this runner; Gradle provisions it."
          fi
          # Accept any new SDK licenses so AGP can download the platform and build-tools it needs.
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$sdkmanager" ]; then yes | "$sdkmanager" --licenses > /dev/null || true; fi

      - name: Load the signing key
        id: signing
        if: steps.version.outputs.release == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.NOLOCKQS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "NOLOCKQS_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No NOLOCKQS_KEYSTORE_BASE64 secret: $TAG is signed with a temporary key and saved as a draft."
          fi

      - name: Build debug and release APKs
        env:
          NOLOCKQS_KEYSTORE_PASSWORD: ${{ secrets.NOLOCKQS_KEYSTORE_PASSWORD }}
          NOLOCKQS_KEY_ALIAS: ${{ secrets.NOLOCKQS_KEY_ALIAS }}
          NOLOCKQS_KEY_PASSWORD: ${{ secrets.NOLOCKQS_KEY_PASSWORD }}
        run: ./gradlew :app:assembleDebug :app:assembleRelease --stacktrace

      # The release is named exactly like its tag, and the APK carries the same name.
      - name: Publish the release
        if: steps.version.outputs.release == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          SIGNED: ${{ steps.signing.outputs.signed }}
        run: |
          apk="NoLockQS-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          changes=$(awk -v v="$VERSION" 'tolower($0) ~ "^v" v "([ :]|$)" { found = 1; next } found && /^[Vv][0-9]/ { exit } found' Changelog \
            | sed -e 's/^###[[:space:]]*-[[:space:]]*/- /' -e '/^[[:space:]]*$/d')
          {
            echo "## Install"
            echo "1. Install \`$apk\` on your rooted device."
            echo "2. In LSPosed, enable NoLockQS for **System UI** and **System Framework**."
            echo "3. Reboot and the protection is active."
            if [ -n "$changes" ]; then printf '\n## Changes\n%s\n' "$changes"; fi
            if [ "$SIGNED" != "true" ]; then
              printf '\n> [!WARNING]\n> Signed with a temporary key: uninstall the previous version before installing this one.\n'
            fi
          } > "$RUNNER_TEMP/release-notes.md"
          flags=(--title "$TAG" --target "$GITHUB_SHA" --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes)
          if [ "$SIGNED" != "true" ]; then flags+=(--draft); fi
          gh release create "$TAG" "$apk" "${flags[@]}"
